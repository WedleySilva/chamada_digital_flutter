name: chamada_digital
description: "Protótipo N2 para chamada automática."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Formatação de datas e horas
  intl: ^0.19.0

  # Para gerar e salvar arquivos (necessário para o relatório CSV)
  path_provider: ^2.1.3

  # Gerador de CSV
  csv: ^5.1.0

  # Ícones adicionais estilo iOS
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
